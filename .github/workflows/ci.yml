name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Check formatting
        run: |
          $files = gofmt -l .
          if ($files) { Write-Error "gofmt needed: $files"; exit 1 }
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Build the app and its installer
        run: go tool mygo build
      - uses: actions/upload-artifact@v4
        with:
          name: UnityStarter-windows-amd64
          path: build/windows-amd64/
          if-no-files-found: error
