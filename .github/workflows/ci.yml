name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - uses: go-task/setup-task@v2
        with:
          version: '3.52.0'
      - name: Check formatting
        run: |
          $files = gofmt -l .
          if ($files) { Write-Error "gofmt needed: $files"; exit 1 }
      - run: task test
      - name: Check concurrent downloads for races
        run: go test -race -run 'TestParallelDownload|TestDownloadLock|TestDownloadCanceled|TestDownloadFailure|TestSHA256Downloads|TestOpenJDK|TestReleaseCatalog|TestTuanjieCatalog|TestAndroid' ./...

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - uses: go-task/setup-task@v2
        with:
          version: '3.52.0'
      - name: Build the app and its installer
        run: task build
      - run: task checksums
      - uses: actions/upload-artifact@v4
        with:
          name: UnityStarter-windows-amd64
          path: build/windows-amd64/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: go-task/setup-task@v2
        with:
          version: '3.52.0'
      - uses: actions/download-artifact@v4
        with:
          name: UnityStarter-windows-amd64
          path: build/windows-amd64
      - name: Verify version and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: task release
